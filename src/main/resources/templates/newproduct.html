<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add New Product</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="text/javascript" th:src="@{/js/script.js}"></script>
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1a1a, #000000);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-container {
      background: #1e1e1e;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 500px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 1.5rem;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .form-section {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #b0b0b0;
      margin-bottom: 0.5rem;
    }

    input[type="text"],
    input[type="number"],
    input[type="file"],
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      font-size: 14px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="file"]:focus,
    select:focus {
      border-color: #007bff;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
    }

    button[type="submit"]:hover {
      background: linear-gradient(135deg, #0056b3, #003d80);
      box-shadow: 0 6px 20px rgba(0, 123, 255, 0.6);
    }

    .file-input {
      position: relative;
      overflow: hidden;
    }

    .file-input input[type="file"] {
      position: absolute;
      top: 0;
      right: 0;
      min-width: 100%;
      min-height: 100%;
      font-size: 100px;
      text-align: right;
      filter: alpha(opacity=0);
      opacity: 0;
      outline: none;
      background: white;
      cursor: inherit;
      display: block;
    }

    .file-input-label {
      display: block;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      text-align: center;
      cursor: pointer;
      color: #b0b0b0;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .file-input-label:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .file-input-label span {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      color: #888;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .form-container {
        padding: 1.5rem;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
<div class="form-container">
  <h1>Add New Product</h1>
  <form th:action="@{/inventory/add}" method="post" enctype="multipart/form-data">
    <div class="form-section">
      <label for="name">Product Name:</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="form-section">
      <label for="size">Product Size:</label>
      <input type="text" id="size" name="size" required>
    </div>
    <div class="form-section">
      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" name="quantity" required>
    </div>
    <div class="form-section">
      <label for="sku">Product SKU:</label>
      <input type="text" id="sku" name="sku" required>
    </div>
    <div class="form-section">
      <label for="image">Product Image:</label>
      <div class="file-input">
        <input type="file" id="image" name="image" accept="image/*">
        <label for="image" class="file-input-label">
          Choose File
          <span>No file chosen</span>
        </label>
      </div>
    </div>
    <div class="form-section">
      <label for="threshold">Threshold:</label>
      <input type="number" id="threshold" name="threshold" required>
    </div>
    <div class="form-section">
      <label for="vendor">Vendor:</label>
      <select id="vendor" name="vendorId" required>
        <option th:each="vendor : ${vendors}" th:value="${vendor.id}" th:text="${vendor.name}"></option>
      </select>
    </div>
    <button type="submit">Add Product</button>
  </form>
</div>
</body>
</html>
